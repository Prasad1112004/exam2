
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e6e6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        h2 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #5148d8;
        }

        a {
            text-decoration: none;
            color: #6c63ff;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>

        <form>
            <input type="email" placeholder="Enter Email" required>

            <input type="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>
            <button type="button" onclick="alert('Forgot Password functionality is not implemented yet.')">Forgot Password</button>
            <button type="button" onclick="alert('Forgot Password functionality is not implemented yet.')">Forgot Password</button>
            <button type="button" onclick="alert('Login with Google functionality is not implemented yet.')">Login with Google</buttongit add .>
        </form>

        <p>Don't have an account? <a href="#">Sign Up</a></p>
    </div>

</body>
</html>
